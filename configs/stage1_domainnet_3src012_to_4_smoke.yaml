seed: 42
use_evidence: false

dataset:
  type: folder
  root: /big-disk/hzh/LFME/LFME-main/domain_generalization/domainbed/data/domain_net
  source_domains: [clipart, infograph, painting]
  target_domains: [real]
  max_classes: 4
  max_per_domain_class: 2

fourier:
  materialize: false
  views_per_sample: 1
  low_frequency_ratio: 0.08
  interpolation_range: [0.3, 1.0]
  extrapolation_range: [1.0, 1.2]
  extrapolation_probability: 0.5
  overwrite: false

output:
  manifest_dir: runs/stage1_smoke/manifests
  styled_image_dir: runs/stage1_smoke/fourier_images

data:
  source_manifest: runs/stage1_smoke/manifests/source_train.jsonl
  pair_manifest: runs/stage1_smoke/manifests/fourier_pairs.jsonl

model:
  backend: huggingface
  name_or_path: Qwen/Qwen2.5-VL-3B-Instruct
  trust_remote_code: true
  dtype: bfloat16
  attn_implementation: sdpa
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  gradient_checkpointing: true
  min_pixels: 100352
  max_pixels: 401408

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ".*(?:visual\\.blocks\\.[0-9]+\\.attn\\.(?:qkv|proj)|(?:q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj))$"

sft:
  output_dir: runs/stage1_smoke/label_sft_adapter
  include_fourier: false
  max_steps: 2
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 0.0002
  max_length: 2048
  gradient_checkpointing: true
  logging_steps: 1
  save_steps: 2
  report_to: [tensorboard]

grpo:
  mode: independent_pair
  sft_adapter_path: runs/stage1_smoke/label_sft_adapter
  output_dir: runs/stage1_smoke/independent_pair_grpo_adapter
  max_steps: 2
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 0.000001
  num_generations: 2
  max_completion_length: 64
  temperature: 0.9
  top_p: 0.95
  beta: 0.01
  epsilon: 0.2
  format_bonus: 0.05
  logging_steps: 1

evaluation:
  split: test
  adapter_path: runs/stage1_smoke/independent_pair_grpo_adapter
  output_dir: runs/stage1_smoke/evaluation_real_pair_grpo
  max_new_tokens: 48
  max_samples: 8
