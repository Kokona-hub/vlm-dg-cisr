seed: 42
use_evidence: false

dataset:
  type: folder
  root: /big-disk/hzh/LFME/LFME-main/domain_generalization/domainbed/data/domain_net
  source_domains: [clipart, infograph, painting]
  target_domains: [real]
  evidence_bank: configs/evidence_bank_domainnet.json
  max_per_domain_class: null

fourier:
  materialize: false
  views_per_sample: 1
  low_frequency_ratio: 0.08
  interpolation_range: [0.3, 1.0]
  extrapolation_range: [1.0, 1.2]
  extrapolation_probability: 0.5
  overwrite: false

output:
  manifest_dir: runs/domainnet_3src012_to_4_qwen3vl8b/manifests
  styled_image_dir: runs/domainnet_3src012_to_4_qwen3vl8b/fourier_images

data:
  source_manifest: runs/domainnet_3src012_to_4_qwen3vl8b/manifests/source_train.jsonl
  pair_manifest: runs/domainnet_3src012_to_4_qwen3vl8b/manifests/fourier_pairs.jsonl

model:
  backend: huggingface
  # Replace with a local HF directory. Do not set this to qwen3-vl:8b.
  name_or_path: /big-disk/hzh/models/Qwen3-VL-8B-Instruct
  trust_remote_code: true
  dtype: bfloat16
  attn_implementation: sdpa
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  gradient_checkpointing: true
  min_pixels: 100352
  max_pixels: 401408

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  # Run diagnose first; Qwen3-VL module names may require adjustment.
  target_modules: ".*(?:visual\\.blocks\\.[0-9]+\\.attn\\.(?:qkv|proj)|(?:q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj))$"

sft:
  output_dir: runs/domainnet_3src012_to_4_qwen3vl8b/sft_adapter
  include_fourier: false
  num_train_epochs: 1.0
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.0002
  max_length: 2048
  gradient_checkpointing: true
  logging_steps: 5
  save_steps: 250
  save_total_limit: 2
  report_to: [tensorboard]

grpo:
  mode: independent_pair
  sft_adapter_path: runs/domainnet_3src012_to_4_qwen3vl8b/sft_adapter
  output_dir: runs/domainnet_3src012_to_4_qwen3vl8b/grpo_adapter
  num_train_epochs: 1.0
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 2
  learning_rate: 0.000001
  num_generations: 4
  max_completion_length: 96
  temperature: 0.9
  top_p: 0.95
  beta: 0.01
  epsilon: 0.2
  format_bonus: 0.05
  logging_steps: 1
  report_to: [tensorboard]

# TU-CRLoRA-GRPO full experiment. Use the Shared LoRA only for evaluation.
crlora_grpo:
  sft_adapter_path: runs/domainnet_3src012_to_4_qwen3vl8b/sft_adapter
  output_dir: runs/domainnet_3src012_to_4_qwen3vl8b/crlora_grpo
  shared_adapter_name: shared
  reference_adapter_name: reference
  mixed_precision: "no"
  domain_adapter_prefix: domain_
  pseudo_target_rotation: true
  # TU-CRLoRA-GRPO: use the rotated pseudo-target gradient as a validation
  # signal for source-gradient routing, rather than blindly adding it.
  transfer_utility_gating: true
  transfer_utility_temperature: 0.25
  transfer_utility_threshold: 0.0
  # L2 magnitude of the normalized temporary Shared-LoRA update used to
  # measure the held-out GRPO surrogate loss change.
  transfer_utility_step_size: 0.05
  pseudo_target_update_weight: 0.0
  # Kept for backwards-compatible runs with transfer_utility_gating=false.
  pseudo_target_weight: 1.0
  orthogonal_residual: true
  domain_residual_weight: 1.0
  num_train_epochs: 1.0
  gradient_accumulation_steps: 1
  learning_rate: 0.000001
  num_generations: 4
  max_completion_length: 96
  temperature: 0.9
  top_p: 0.95
  beta: 0.01
  epsilon: 0.2
  format_bonus: 0.05
  max_grad_norm: 1.0
  logging_steps: 1

evaluation:
  split: test
  # Use Shared LoRA only; verify the concrete path in crlora_grpo/adapter_paths.json.
  adapter_path: runs/domainnet_3src012_to_4_qwen3vl8b/crlora_grpo/adapters/shared/shared
  output_dir: runs/domainnet_3src012_to_4_qwen3vl8b/evaluation_real_crlora_shared
  max_new_tokens: 64
  max_samples: null

ollama:
  model: qwen3-vl:8b
  base_url: http://127.0.0.1:11435
  timeout: 600
  max_retries: 3
  retry_backoff: 10
  resume: true
