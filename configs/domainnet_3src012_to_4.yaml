seed: 42
use_evidence: true

dataset:
  # DomainBed layout: root/domain/class/image.
  type: folder
  root: /big-disk/hzh/LFME/LFME-main/domain_generalization/domainbed/data/domain_net
  # Domain indices: 0=clipart, 1=infograph, 2=painting, 3=quickdraw, 4=real, 5=sketch.
  # This experiment uses domains 0,1,2 as sources and domain 4 as the unseen target.
  source_domains: [clipart, infograph, painting]
  target_domains: [real]
  evidence_bank: configs/evidence_bank_domainnet.json
  max_per_domain_class: null

fourier:
  # Generate styled views online during PairGRPO to avoid one inode per image.
  materialize: false
  views_per_sample: 1
  low_frequency_ratio: 0.08
  interpolation_range: [0.3, 1.0]
  extrapolation_range: [1.0, 1.2]
  extrapolation_probability: 0.5
  overwrite: false

output:
  manifest_dir: runs/domainnet_3src012_to_4/manifests
  styled_image_dir: runs/domainnet_3src012_to_4/fourier_images

data:
  source_manifest: runs/domainnet_3src012_to_4/manifests/source_train.jsonl
  pair_manifest: runs/domainnet_3src012_to_4/manifests/fourier_pairs.jsonl

model:
  backend: huggingface
  name_or_path: Qwen/Qwen2.5-VL-3B-Instruct
  trust_remote_code: true
  dtype: bfloat16
  attn_implementation: sdpa
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  gradient_checkpointing: true
  # About 128-512 visual tokens per image for Qwen2.5-VL (patch merge factor included).
  min_pixels: 100352
  max_pixels: 401408

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  # Exact regex avoids accidentally attaching LoRA to visual.patch_embed.proj (a Conv3d layer).
  target_modules: ".*(?:visual\\.blocks\\.[0-9]+\\.attn\\.(?:qkv|proj)|(?:q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj))$"

sft:
  output_dir: runs/domainnet_3src012_to_4/sft_adapter
  num_train_epochs: 1.0
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.0002
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  # DomainNet's 345-label candidate list plus visual tokens does not fit in 512 tokens.
  max_length: 2048
  gradient_checkpointing: true
  logging_steps: 5
  save_steps: 250
  save_total_limit: 2
  report_to: [tensorboard]
  resume_from_checkpoint: null

grpo:
  sft_adapter_path: runs/domainnet_3src012_to_4/sft_adapter
  output_dir: runs/domainnet_3src012_to_4/grpo_adapter
  num_train_epochs: 1.0
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 2
  learning_rate: 0.000001
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  gradient_checkpointing: true
  num_generations: 4
  max_completion_length: 128
  temperature: 0.9
  top_p: 0.95
  beta: 0.01
  loss_type: dapo
  use_vllm: false
  reward_functions: [paired_correctness, all_views_correct, format, evidence_quality]
  reward_weights: [1.0, 1.0, 0.1, 0.2]
  logging_steps: 1
  save_steps: 100
  save_total_limit: 2
  report_to: [tensorboard]
  resume_from_checkpoint: null

evaluation:
  split: test
  adapter_path: runs/domainnet_3src012_to_4/grpo_adapter
  output_dir: runs/domainnet_3src012_to_4/evaluation_real
  max_new_tokens: 96
  max_samples: null

ollama:
  model: qwen3-vl:8b
  base_url: http://127.0.0.1:11434
  timeout: 300
  max_retries: 2
  retry_backoff: 5
  max_consecutive_failures: 3
  checkpoint_every: 10
  resume: true
